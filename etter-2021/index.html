<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bildekart Kongshaugen 2021</title>
<style>
:root { --rod:#ea4f3d; --sort:#121212; --lys:#f8f8f8; --linje:#d9d9d9; --dempet:#5c5c5c; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { display:flex; flex-direction:column; background:var(--lys); color:var(--sort); font:15px/1.4 Poppins,"Segoe UI",system-ui,sans-serif; }
header { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:10px 16px; background:#fff; border-bottom:1px solid var(--linje); }
h1 { font-size:18px; margin:0; font-weight:600; }
.valg { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
.valg label { display:inline-flex; gap:6px; align-items:center; cursor:pointer; min-height:28px; }
.prikk { width:14px; height:14px; border-radius:50%; border:1.5px solid #141414; display:inline-block; }
button { font:inherit; padding:5px 12px; border:1px solid var(--linje); border-radius:6px; background:#fff; color:var(--sort); cursor:pointer; min-height:32px; }
button:hover { border-color:var(--sort); }
button:focus-visible, input:focus-visible { outline:2px solid var(--rod); outline-offset:2px; }
#kart { flex:1; min-height:0; position:relative; background:#26302a; overflow:hidden; }
svg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; user-select:none; }
svg.drar { cursor:grabbing; }
circle { stroke:#141414; }
circle.valgt { stroke:#fff; }
#pop { position:absolute; z-index:5; display:none; background:#fff; border-radius:8px; padding:8px; box-shadow:0 6px 24px rgba(0,0,0,.45); pointer-events:none; width:min(400px, calc(100vw - 24px)); }
#pop .rute { display:grid; gap:4px; }
#pop .rute.to { grid-template-columns:1fr 1fr; }
#pop img { width:100%; height:300px; object-fit:contain; display:block; background:#eee; border-radius:4px; }
#pop .rute.to img { height:150px; }
#pop p, #stor p { margin:6px 0 0; font-size:13px; }
.dempet { color:var(--dempet); }
footer { padding:6px 16px; font-size:12px; color:var(--dempet); background:#fff; border-top:1px solid var(--linje); }
#stor { position:fixed; inset:0; z-index:10; display:none; background:rgba(0,0,0,.85); align-items:center; justify-content:center; padding:16px; }
#stor .boks { background:#fff; border-radius:8px; padding:12px; max-width:min(760px, 100%); max-height:100%; overflow:auto; }
#stor img { display:block; max-width:100%; max-height:70vh; margin:auto; }
#stor .knapper { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
@media (max-width:640px) { h1 { font-size:16px; } header { padding:8px 16px; } }
</style></head><body>

</header>

svg.addEventListener("pointerdown", ev => { drag = { x:ev.clientX, y:ev.clientY, vx:vb.x, vy:vb.y, flyttet:false }; svg.setPointerCapture(ev.pointerId); });
svg.addEventListener("pointermove", ev => {
  if (drag) {
    const m = vb.w / kart.getBoundingClientRect().width, dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if (Math.hypot(dx, dy) > 4) { drag.flyttet = true; svg.classList.add("drar"); skjul(); }
    if (drag.flyttet) { vb.x = drag.vx - dx * m; vb.y = drag.vy - dy * m; sett(); }
    return;
  }
  const l = nære(ev);
  if (l.length) vispop(l, ev); else skjul();
});
svg.addEventListener("pointerup", ev => {
  const var_klikk = drag && !drag.flyttet; drag = null; svg.classList.remove("drar");
  if (var_klikk) { const l = nære(ev); if (l.length) åpne(l, 0); }
});
svg.addEventListener("pointerleave", () => { if (!drag) skjul(); });
svg.addEventListener("wheel", ev => { ev.preventDefault(); const q = pkt(ev); zoom(ev.deltaY > 0 ? 1.25 : 0.8, q.x, q.y); skjul(); }, { passive:false });
let startet = false;
new ResizeObserver(() => { if (!kart.clientWidth) return; if (startet) sett(); else { startet = true; feltOmr(); } }).observe(kart);
// stort bilde
const stor = document.getElementById("stor"); let gruppe = [], nr = 0;
function tegnStor() {
  const p = gruppe[nr];
  document.getElementById("storbilde").src = p.b;
  document.getElementById("stortekst").innerHTML = tekst(p) + (gruppe.length > 1 ? `<p class="dempet">Bilde ${nr + 1} av ${gruppe.length} på dette stedet</p>` : "");
  document.getElementById("forrige").hidden = document.getElementById("neste").hidden = gruppe.length < 2;
}
function åpne(l, i) { gruppe = l; nr = i; skjul(); tegnStor(); stor.style.display = "flex"; document.getElementById("lukk").focus(); }
const bla = d => { nr = (nr + d + gruppe.length) % gruppe.length; tegnStor(); };
const lukk = () => stor.style.display = "none";
document.getElementById("forrige").onclick = () => bla(-1);
document.getElementById("neste").onclick = () => bla(1);
document.getElementById("lukk").onclick = lukk;
stor.addEventListener("click", ev => { if (ev.target === stor) lukk(); });
document.addEventListener("keydown", ev => {
  if (stor.style.display !== "flex") return;
  if (ev.key === "Escape") lukk(); if (ev.key === "ArrowLeft") bla(-1); if (ev.key === "ArrowRight") bla(1);
});
// valg
const valg = document.getElementById("valg");
for (const c of ["etter", "for", "uten"]) {
  if (!P.some(p => p.c === c)) continue; // skjul valg uten bilder
  const n = P.filter(p => p.c === c).length, l = document.createElement("label");
  l.innerHTML = `<input type="checkbox" checked><span class="prikk" style="background:${FARGE[c]}"></span>${NAVN[c]} (${n})`;
  l.title = KILDE[c];
  l.querySelector("input").onchange = ev => { vis[c] = ev.target.checked; for (const p of P) if (p.c === c) p.el.style.display = vis[c] ? "" : "none"; skjul(); };
  valg.append(l);
}
