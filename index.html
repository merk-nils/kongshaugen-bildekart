<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>Bildekart Kongshaugen</title>
<style>
:root { --rod:#ea4f3d; --sort:#121212; --lys:#f8f8f8; --linje:#d9d9d9; --dempet:#5c5c5c; }
* { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body { display:flex; flex-direction:column; background:var(--lys); color:var(--sort); font:15px/1.4 Poppins,"Segoe UI",system-ui,sans-serif; }
header { display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; padding:10px 16px; background:#fff; border-bottom:1px solid var(--linje); }
h1 { font-size:18px; margin:0; font-weight:600; }
.valg { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; }
.valg label { display:inline-flex; gap:6px; align-items:center; cursor:pointer; min-height:28px; }
.prikk { width:14px; height:14px; border-radius:50%; border:1.5px solid #141414; display:inline-block; }
button { font:inherit; padding:5px 12px; border:1px solid var(--linje); border-radius:6px; background:#fff; color:var(--sort); cursor:pointer; min-height:32px; }
button:hover { border-color:var(--sort); }
button:focus-visible, input:focus-visible { outline:2px solid var(--rod); outline-offset:2px; }
#kart { flex:1; min-height:0; position:relative; background:#26302a; overflow:hidden; }
svg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; user-select:none; }
svg.drar { cursor:grabbing; }
circle { stroke:#141414; }
circle.valgt { stroke:#fff; }
#pop { position:absolute; z-index:5; display:none; background:#fff; border-radius:8px; padding:8px; box-shadow:0 6px 24px rgba(0,0,0,.45); pointer-events:none; width:min(400px, calc(100vw - 24px)); }
#pop .rute { display:grid; gap:4px; }
#pop .rute.to { grid-template-columns:1fr 1fr; }
#pop img { width:100%; height:300px; object-fit:contain; display:block; background:#eee; border-radius:4px; }
#pop .rute.to img { height:150px; }
#pop p, #stor p { margin:6px 0 0; font-size:13px; }
.dempet { color:var(--dempet); }
footer { padding:6px 16px; font-size:12px; color:var(--dempet); background:#fff; border-top:1px solid var(--linje); }
#stor { position:fixed; inset:0; z-index:10; display:none; background:rgba(0,0,0,.85); align-items:center; justify-content:center; padding:16px; }
#stor .boks { background:#fff; border-radius:8px; padding:12px; max-width:min(760px, 100%); max-height:100%; overflow:auto; }
#stor img { display:block; max-width:100%; max-height:70vh; margin:auto; }
#stor .knapper { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
@media (max-width:640px) { h1 { font-size:16px; } header { padding:8px 16px; } }
</style></head><body>

</header>
